name: Quality

# Style and documentation gates. The repo ships a detailed .editorconfig and a
# lot of cross-referencing Markdown; neither was enforced, so both could drift
# silently. Kept out of ci.yml so a formatting failure is distinguishable at a
# glance from a test failure.
#
# The checks themselves live in .github/scripts as ordinary Python files with
# their own tests, so a contributor can run them before pushing instead of
# discovering the result in a workflow log.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight; only the
# latest state of a branch is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  quality:
    name: Formatting + documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify formatting
        run: dotnet format WorkPlanStudio.slnx --verify-no-changes --severity warn

      # The checks are tested before they are trusted: a link checker that
      # silently stopped finding anything would otherwise report success.
      - name: Test the repository checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      # Every relative Markdown link must resolve, anchor included. The docs
      # cross-reference ADRs, workflows and source files heavily, and a renamed
      # heading breaks the README's coverage badges without touching a filename.
      - name: Verify documentation links
        run: python3 .github/scripts/check_doc_links.py

      # The two resource files drift silently: a missing key does not throw, it
      # renders the key name. The parity assertions live in LocalizationTests,
      # which the CI workflow runs — this is the fast pre-check.
      - name: Verify resource files parse and match
        run: python3 .github/scripts/check_resources.py
