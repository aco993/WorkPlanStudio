name: Deploy to GitHub Pages

# Builds the Blazor WebAssembly app and publishes it as a static site to GitHub
# Pages. The app runs entirely in the browser (EF Core + SQLite compiled to
# WebAssembly), so no server or backend is required.
#
# The deployment is gated on every suite: the three unit/component projects with
# their coverage gates (by calling ci.yml rather than repeating it — the
# thresholds live there and only there) and the Playwright run (E2E, axe,
# visual). The coverage numbers measured in that call become the badge JSON the
# README links to, served from the site itself under /badges/.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: the default is read-only, and the two elevated grants sit on
# the jobs that need them. The job that executes test code — which restores and
# runs third-party packages — must not hold a deployment identity.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a run cancelled
# between upload-pages-artifact and deploy-pages leaves the site on the previous
# version while the commit shows a cancelled, not failed, run. Cancelling a test
# run is free; cancelling a production deploy is a silent no-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Unit, property, data & component tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      badges: true

  e2e:
    name: Browser tests
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  build:
    needs: [tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Install WebAssembly tools (native SQLite relink)
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/WorkPlanStudio/WorkPlanStudio.csproj -c Release -o release

      # GitHub Pages serves the app from https://<user>.github.io/<repo>/,
      # so the <base href> must point at the repository sub-path.
      - name: Rewrite base href for project page
        run: sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#g' release/wwwroot/index.html

      # Single-page-app fallback so deep links (e.g. /work-plans/3) resolve.
      - name: Add SPA 404 fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # Stop GitHub Pages' Jekyll from ignoring the _framework folder.
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      # ci.yml measures coverage in two jobs, so the badges arrive as two
      # artifacts; they are merged back into one folder here. Four files:
      # engine, working time, app, shared domain.
      - name: Add coverage badges to the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: badges-*
          merge-multiple: true
          path: release/wwwroot/badges

      - name: Check the badges arrived
        run: |
          count=$(find release/wwwroot/badges -name '*.json' | wc -l)
          echo "badge files: $count"
          test "$count" -eq 4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
