name: Deploy to GitHub Pages

# Builds the Blazor WebAssembly app and publishes it as a static site to GitHub Pages.
# The app runs entirely in the browser (EF Core + SQLite compiled to WebAssembly),
# so no server or backend is required.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The public Pages release is gated by dependency, unit/component/API and real
  # browser checks. A UI regression cannot deploy merely because engine tests pass.
  test:
    name: Full release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Restore
        run: dotnet restore WorkPlanStudio.slnx
      - name: Dependency security audit
        run: pwsh -NoProfile -File scripts/Assert-NoVulnerablePackages.ps1
      - name: Formatting and documentation integrity
        run: |
          dotnet format WorkPlanStudio.slnx --verify-no-changes --no-restore
          pwsh -NoProfile -File scripts/Test-DocumentationLinks.ps1
      - name: Unit, property, component and API integration tests
        run: |
          dotnet test tests/WorkPlanStudio.Scheduling.Tests/WorkPlanStudio.Scheduling.Tests.csproj -c Release --no-restore --coverage --coverage-output-format cobertura --coverage-output deploy-coverage.cobertura.xml
          pwsh -NoProfile -File scripts/Assert-CoberturaCoverage.ps1 -FileName deploy-coverage.cobertura.xml
          dotnet test tests/WorkPlanStudio.Web.Tests/WorkPlanStudio.Web.Tests.csproj -c Release --no-restore
          dotnet test tests/WorkPlanStudio.Api.Tests/WorkPlanStudio.Api.Tests.csproj -c Release --no-restore
      - name: Build and install Playwright
        run: |
          dotnet build tests/WorkPlanStudio.E2E/WorkPlanStudio.E2E.csproj -c Release --no-restore
          pwsh tests/WorkPlanStudio.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start offline release candidate
        run: |
          nohup dotnet run --project src/WorkPlanStudio/WorkPlanStudio.csproj --launch-profile http --no-restore > app.log 2>&1 &
          for attempt in {1..90}; do
            curl --fail --silent http://localhost:5235/ --output /dev/null && break
            sleep 2
          done
          curl --fail --silent http://localhost:5235/ --output /dev/null
      - name: Browser regression gate
        env:
          E2E_BASE_URL: http://localhost:5235
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: >
          dotnet test tests/WorkPlanStudio.E2E/WorkPlanStudio.E2E.csproj -c Release --no-build
          -- --no-progress --minimum-expected-tests 10
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-e2e-artifacts
          path: |
            e2e-artifacts/
            app.log
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly tools (native SQLite relink)
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/WorkPlanStudio/WorkPlanStudio.csproj -c Release -o release

      # GitHub Pages serves the app from https://<user>.github.io/<repo>/,
      # so the <base href> must point at the repository sub-path.
      - name: Rewrite base href for project page
        run: sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#g' release/wwwroot/index.html

      # Single-page-app fallback so deep links (e.g. /work-plans/3) resolve.
      - name: Add SPA 404 fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # Stop GitHub Pages' Jekyll from ignoring the _framework folder.
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
