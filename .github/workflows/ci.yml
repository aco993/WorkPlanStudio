name: CI

# Build and test on every pull request. Split into two jobs by what they need:
#   • library-tests — the two pure libraries (scheduling engine, working time);
#     no Blazor, no SQLite, no WebAssembly, so they run in seconds. Coverage is
#     measured and gated per assembly.
#   • web-tests     — data, mapper, assistant and bUnit component tests; these
#     reference the Blazor WASM app, so the job installs the wasm-tools workload
#     to build it. Coverage of the app assembly is measured and gated too.
# The thresholds live in the coverage_gate.py calls below; the badges the
# README shows are produced from the same numbers by the deploy workflow.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight; only the
# latest state of a branch is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  library-tests:
    name: Engine + working-time tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The collector writes a relative --coverage-output into ./TestResults of the working directory.
      - name: Test scheduling engine (with coverage)
        run: >
          dotnet test tests/WorkPlanStudio.Scheduling.Tests/WorkPlanStudio.Scheduling.Tests.csproj -c Release
          --coverage --coverage-output-format cobertura --coverage-output engine.cobertura.xml

      - name: Test working-time library (with coverage)
        run: >
          dotnet test tests/WorkPlanStudio.WorkingTime.Tests/WorkPlanStudio.WorkingTime.Tests.csproj -c Release
          --coverage --coverage-output-format cobertura --coverage-output workingtime.cobertura.xml

      - name: Coverage gate (engine ≥ 90 % lines, working time ≥ 90 % lines)
        run: |
          python3 .github/scripts/coverage_gate.py TestResults/engine.cobertura.xml WorkPlanStudio.Scheduling=90
          python3 .github/scripts/coverage_gate.py TestResults/workingtime.cobertura.xml WorkPlanStudio.WorkingTime=90

      - name: Build coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:'TestResults/*.cobertura.xml' -targetdir:coverage-report -reporttypes:'Html;TextSummary' -assemblyfilters:'+WorkPlanStudio.Scheduling;+WorkPlanStudio.WorkingTime'
          echo '### Library coverage report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        continue-on-error: true   # the gate is the check; a hiccup in the artifact service is not a failed build
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-libraries
          path: coverage-report
          if-no-files-found: ignore
          retention-days: 14

  web-tests:
    name: Data, mapper, assistant & component tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install WebAssembly tools (needed to build the referenced app)
        run: dotnet workload install wasm-tools

      - name: Test data, mapper, assistant & components (with coverage)
        run: >
          dotnet test tests/WorkPlanStudio.Web.Tests/WorkPlanStudio.Web.Tests.csproj -c Release
          --coverage --coverage-output-format cobertura --coverage-output web.cobertura.xml

      - name: Coverage gate (app ≥ 65 % lines)
        run: python3 .github/scripts/coverage_gate.py TestResults/web.cobertura.xml WorkPlanStudio=65

      - name: Build coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:'TestResults/web.cobertura.xml' -targetdir:coverage-report -reporttypes:'Html;TextSummary' -assemblyfilters:'+WorkPlanStudio'
          echo '### App coverage report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        continue-on-error: true   # the gate is the check; a hiccup in the artifact service is not a failed build
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-app
          path: coverage-report
          if-no-files-found: ignore
          retention-days: 14
