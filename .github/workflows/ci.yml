name: CI

# Independent jobs keep pure-engine coverage fast while API/PostgreSQL,
# WebAssembly, container and browser boundaries receive their own evidence.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WorkPlanStudio.slnx
      - name: Fail on vulnerable direct or transitive packages
        run: pwsh -NoProfile -File scripts/Assert-NoVulnerablePackages.ps1

  quality:
    name: Formatting + documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WorkPlanStudio.slnx
      - name: Verify formatting
        run: dotnet format WorkPlanStudio.slnx --verify-no-changes --no-restore
      - name: Verify local documentation links
        run: pwsh -NoProfile -File scripts/Test-DocumentationLinks.ps1

  engine-tests:
    name: Engine tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test scheduling engine (with coverage)
        run: >
          dotnet test tests/WorkPlanStudio.Scheduling.Tests/WorkPlanStudio.Scheduling.Tests.csproj -c Release
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Enforce 100% engine line and branch coverage
        run: pwsh -NoProfile -File scripts/Assert-CoberturaCoverage.ps1 -FileName coverage.cobertura.xml

      - name: Build coverage report
        if: always()
        run: |
          mkdir -p coverage-report
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          outputs = list(Path('.').rglob('coverage.cobertura.xml'))
          if not outputs:
              summary = 'Coverage artifact unavailable because the test step did not produce it.\n'
          else:
              source = outputs[0]
              root = ET.parse(source).getroot()
              summary = (
                  f"Lines: {root.attrib['lines-covered']}/{root.attrib['lines-valid']} "
                  f"({float(root.attrib['line-rate']) * 100:.2f}%)\n"
                  f"Branches: {root.attrib['branches-covered']}/{root.attrib['branches-valid']} "
                  f"({float(root.attrib['branch-rate']) * 100:.2f}%)\n"
              )
              shutil.copy2(source, 'coverage-report/coverage.cobertura.xml')
          Path('coverage-report/Summary.txt').write_text(summary, encoding='utf-8')
          PY
          echo '### Engine code coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: ignore

  web-tests:
    name: Mapper & component tests (bUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install WebAssembly tools (needed to build the referenced app)
        run: dotnet workload install wasm-tools

      - name: Test mapper & components
        run: dotnet test tests/WorkPlanStudio.Web.Tests/WorkPlanStudio.Web.Tests.csproj -c Release

  api-tests:
    name: API integration tests + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: workplan_tests
          POSTGRES_USER: workplan_tests
          POSTGRES_PASSWORD: CiPostgresTest_2026_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workplan_tests -d workplan_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Restore local tools
        run: dotnet tool restore
      - name: Test authenticated production API
        run: dotnet test tests/WorkPlanStudio.Api.Tests/WorkPlanStudio.Api.Tests.csproj -c Release
      - name: Test real PostgreSQL migrations and lease fencing
        env:
          WPS_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=workplan_tests;Username=workplan_tests;Password=CiPostgresTest_2026_only
        run: >
          dotnet test tests/WorkPlanStudio.Postgres.Tests/WorkPlanStudio.Postgres.Tests.csproj -c Release
          -- --no-progress --minimum-expected-tests 2
      - name: Generate SQLite migration script
        run: dotnet ef migrations script --project src/WorkPlanStudio.Persistence --startup-project src/WorkPlanStudio.Api --output sqlite-migrations.sql
      - name: Generate PostgreSQL migration script
        env:
          Database__Provider: Postgres
          ConnectionStrings__Production: Host=localhost;Database=workplanstudio;Username=ci;Password=ci
        run: dotnet ef migrations script --project src/WorkPlanStudio.PostgresMigrations --startup-project src/WorkPlanStudio.Api --output postgres-migrations.sql
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-scripts
          path: '*-migrations.sql'

  performance:
    name: Scheduling regression ceilings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tools/WorkPlanStudio.Scheduling.Scenarios/WorkPlanStudio.Scheduling.Scenarios.csproj -c Release -- --verify

  container:
    name: Production container runtime + HTTP smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: workplan-ci
      POSTGRES_PASSWORD: CiComposePostgres_2026_only
      ALLOWED_HOSTS: localhost
      BOOTSTRAP_ADMIN_EMAIL: production-e2e@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ProductionE2E_2026_only_Strong!
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: workplanstudio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose and start PostgreSQL 18
        run: |
          docker compose config --quiet
          docker compose up --detach database
          for attempt in {1..40}; do
            docker compose exec --no-TTY database pg_isready -U workplanstudio -d workplanstudio && break
            sleep 1
          done
          database_id=$(docker compose ps --quiet database)
          test -n "$database_id"
          for attempt in {1..40}; do
            database_health=$(docker inspect --format '{{.State.Health.Status}}' "$database_id")
            test "$database_health" = healthy && break
            sleep 1
          done
          test "$database_health" = healthy
      - name: Start isolated SMTP test service
        run: >
          docker run --detach --name mailpit-ci --network workplan-ci_default --publish 8025:8025
          axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
      - name: Start production image with PostgreSQL, Identity and SMTP
        run: >
          docker run --detach --name workplan-api-ci --network workplan-ci_default --publish 8080:8080
          --read-only --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=64m --volume workplan-ci-keys:/keys
          --env AllowedHosts=localhost
          --env Database__Provider=Postgres
          --env 'ConnectionStrings__Production=Host=database;Port=5432;Database=workplanstudio;Username=workplanstudio;Password=CiComposePostgres_2026_only'
          --env Database__ApplyMigrationsOnStartup=true
          --env Identity__AllowRegistration=true
          --env Identity__BootstrapAdminEmail=production-e2e@example.com
          --env 'Identity__BootstrapAdminPassword=ProductionE2E_2026_only_Strong!'
          --env Email__Enabled=true
          --env Email__Host=mailpit-ci
          --env Email__Port=1025
          --env Email__UseSsl=false
          --env Email__SenderAddress=no-reply@workplan.test
          --env Email__PublicBaseUrl=http://localhost:8080
          --env Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics=Warning
          workplanstudio:ci
      - name: Runtime, static-asset and security-header smoke
        run: |
          for attempt in {1..40}; do
            curl --fail --silent --header 'Host: localhost' http://localhost:8080/health/live && break
            sleep 1
          done
          curl --fail --silent --header 'Host: localhost' http://localhost:8080/_framework/dotnet.js --output /dev/null
          curl --silent --head --header 'Host: localhost' http://localhost:8080/ | grep -qi 'content-security-policy:'
          curl --silent --head --header 'Host: localhost' http://localhost:8080/ | grep -qi 'x-content-type-options: nosniff'
          test "$(docker inspect workplan-api-ci --format '{{.Config.User}}')" != "0"
          test "$(docker inspect workplan-api-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          docker inspect workplan-api-ci --format '{{json .HostConfig.CapDrop}}' | grep -q 'ALL'
          docker inspect workplan-api-ci --format '{{json .HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges'
      - name: SMTP password-reset delivery and one-time-token flow
        run: |
          cookies=$(mktemp)
          csrf=$(curl --fail --silent --cookie-jar "$cookies" --header 'Host: localhost' http://localhost:8080/api/auth/antiforgery | jq -r .token)
          register_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$cookies" --cookie-jar "$cookies" \
            --header 'Host: localhost' --header 'Content-Type: application/json' --header "X-CSRF-TOKEN: $csrf" \
            --data '{"email":"reset-ci@example.com","password":"Initial!Password123456"}' \
            http://localhost:8080/api/auth/register)
          test "$register_status" = 201
          csrf=$(curl --fail --silent --cookie "$cookies" --cookie-jar "$cookies" --header 'Host: localhost' http://localhost:8080/api/auth/antiforgery | jq -r .token)
          reset_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$cookies" \
            --header 'Host: localhost' --header 'Content-Type: application/json' --header "X-CSRF-TOKEN: $csrf" \
            --data '{"email":"reset-ci@example.com"}' http://localhost:8080/api/auth/password-reset/request)
          test "$reset_status" = 202
          for attempt in {1..20}; do
            message=$(curl --fail --silent http://localhost:8025/view/latest.txt 2>/dev/null || true)
            echo "$message" | grep -q 'resetToken=' && break
            sleep 1
          done
          reset_url=$(echo "$message" | grep -o 'http://localhost:8080/?resetEmail=[^[:space:]]*' | head -1)
          test -n "$reset_url"
          reset_token=${reset_url##*resetToken=}
          csrf=$(curl --fail --silent --cookie "$cookies" --cookie-jar "$cookies" --header 'Host: localhost' http://localhost:8080/api/auth/antiforgery | jq -r .token)
          confirm_body=$(jq -n --arg token "$reset_token" \
            '{email:"reset-ci@example.com",token:$token,newPassword:"Changed!Password123456"}')
          confirm_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$cookies" \
            --header 'Host: localhost' --header 'Content-Type: application/json' --header "X-CSRF-TOKEN: $csrf" \
            --data "$confirm_body" http://localhost:8080/api/auth/password-reset/confirm)
          test "$confirm_status" = 204
          smtp_accepted=$(curl --fail --silent http://localhost:8025/api/v1/info | jq -r .RuntimeStats.SMTPAccepted)
          test "$smtp_accepted" = 1
      - name: Concurrent HTTP load smoke
        run: >
          seq 1 100 | xargs -P 20 -I '{}' curl --fail --silent
          --header 'Host: localhost' http://localhost:8080/health/live --output /dev/null
      - name: Build authenticated production E2E tests
        run: dotnet build tests/WorkPlanStudio.ProductionE2E/WorkPlanStudio.ProductionE2E.csproj -c Release
      - name: Install Playwright Chromium
        run: pwsh tests/WorkPlanStudio.ProductionE2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Authenticated production UX and accessibility E2E
        env:
          E2E_PRODUCTION_BASE_URL: http://localhost:8080
          E2E_PRODUCTION_EMAIL: production-e2e@example.com
          E2E_PRODUCTION_PASSWORD: ProductionE2E_2026_only_Strong!
        run: >
          dotnet test tests/WorkPlanStudio.ProductionE2E/WorkPlanStudio.ProductionE2E.csproj -c Release --no-build
          -- --no-progress --minimum-expected-tests 3
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs workplan-api-ci || true
          docker logs mailpit-ci || true
          docker compose logs database || true
      - name: Stop production image
        if: always()
        run: |
          docker rm --force workplan-api-ci mailpit-ci || true
          docker volume rm workplan-ci-keys || true
          docker compose down --volumes || true
