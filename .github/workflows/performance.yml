name: Performance

# Three measurements, all published as artifacts and into the job summary:
#   • budgets    — the wall-clock tripwires the pull-request gate deliberately
#     does not run (see ci.yml). Here a slow result is a signal worth reading,
#     not a re-run.
#   • benchmarks — BenchmarkDotNet over the two pure libraries (short job, so
#     the numbers are indicative; run the full job locally for precision).
#   • lighthouse — Lighthouse CI against the published site, served the way
#     GitHub Pages serves it (static files, pre-compressed assets honoured).
#     Accessibility, best practices and SEO are asserted; the performance
#     score of a 30 MB WebAssembly runtime is reported, not gated.
# Runs on main, weekly, and on demand — not on every pull request, where the
# runner noise would say more than the code.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight; only the
# latest state of a branch is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  budgets:
    name: Wall-clock budget tripwires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The budgets themselves are unchanged and still assert; only where they
      # run has moved. --minimum-expected-tests keeps the filter honest: a typo
      # that matched no class would otherwise pass as an empty run.
      - name: Scheduling engine budgets
        run: >
          dotnet test tests/WorkPlanStudio.Scheduling.Tests/WorkPlanStudio.Scheduling.Tests.csproj -c Release
          --filter-class *.PerformanceBudgetTests --minimum-expected-tests 3

      - name: Working-time budgets
        run: >
          dotnet test tests/WorkPlanStudio.WorkingTime.Tests/WorkPlanStudio.WorkingTime.Tests.csproj -c Release
          --filter-class *.PerformanceBudgetTests --minimum-expected-tests 2

  benchmarks:
    name: BenchmarkDotNet (short job)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run benchmarks
        run: dotnet run -c Release --project tests/WorkPlanStudio.Benchmarks -- --filter '*' --job short --artifacts benchmark-results --exporters GitHub

      - name: Summarise
        run: |
          echo '### Benchmarks (short job, indicative)' >> "$GITHUB_STEP_SUMMARY"
          for f in benchmark-results/results/*-report-github.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done

      - name: Upload results
        continue-on-error: true   # the gate is the check; a hiccup in the artifact service is not a failed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results/results
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  lighthouse:
    name: Lighthouse CI on the published site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/WorkPlanStudio/WorkPlanStudio.csproj -c Release -o release

      # Serve the published folder like a static host: SPA fallback, and the
      # pre-compressed .br/.gz siblings served when the browser accepts them.
      - name: Serve the published site
        run: |
          npx --yes http-server@14.1.1 release/wwwroot -p 8080 -P "http://localhost:8080?" --gzip --brotli -s &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null; then echo "site is up"; exit 0; fi
            sleep 1
          done
          echo "site did not start"; exit 1

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12.6.2
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
