name: Production evidence

on:
  pull_request:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Soak duration in minutes
        required: true
        default: '15'
        type: string
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: production-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak-and-dast:
    name: HTTP soak + OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SOAK_MINUTES: ${{ github.event_name == 'schedule' && '240' || github.event_name == 'pull_request' && '5' || inputs.duration_minutes || '15' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag workplanstudio:evidence .
      - name: Start isolated production container
        run: |
          docker network create workplan-evidence
          docker run --detach --name workplan-evidence --network workplan-evidence --publish 8080:8080 \
            --env 'AllowedHosts=localhost;workplan-evidence' \
            --env Database__Provider=Sqlite \
            --env 'ConnectionStrings__Production=Data Source=/tmp/workplan.db' \
            --env Database__ApplyMigrationsOnStartup=true \
            workplanstudio:evidence
          for attempt in {1..60}; do
            curl --fail --silent --header 'Host: localhost' http://localhost:8080/health/live && break
            sleep 1
          done
      - name: Sustained concurrent HTTP soak
        run: |
          set -o pipefail
          node <<'NODE' | tee soak-summary.txt
          const http = require('node:http');

          const concurrency = 25;
          const durationMs = Number(process.env.SOAK_MINUTES) * 60_000;
          const deadline = Date.now() + durationMs;
          const agent = new http.Agent({ keepAlive: true, maxSockets: concurrency });
          let requests = 0;
          let failures = 0;
          const statusCounts = new Map();

          function requestOnce() {
            return new Promise((resolve) => {
              const request = http.get({
                agent,
                hostname: 'localhost',
                port: 8080,
                path: '/health/live',
                headers: { Host: 'localhost' },
                timeout: 5_000
              }, (response) => {
                response.resume();
                response.on('end', () => {
                  requests += 1;
                  statusCounts.set(response.statusCode, (statusCounts.get(response.statusCode) ?? 0) + 1);
                  if (response.statusCode !== 200) failures += 1;
                  resolve();
                });
              });
              request.on('timeout', () => request.destroy(new Error('request timeout')));
              request.on('error', () => {
                requests += 1;
                failures += 1;
                resolve();
              });
            });
          }

          async function worker() {
            while (Date.now() < deadline) await requestOnce();
          }

          Promise.all(Array.from({ length: concurrency }, worker)).then(() => {
            agent.destroy();
            console.log(JSON.stringify({
              durationMinutes: Number(process.env.SOAK_MINUTES),
              concurrency,
              requests,
              failures,
              statusCounts: Object.fromEntries(statusCounts)
            }, null, 2));
            if (requests === 0 || failures !== 0) process.exitCode = 1;
          });
          NODE
          curl --fail --silent --header 'Host: localhost' http://localhost:8080/api/health/ready | jq -e '.status == "ready"'
      - name: OWASP ZAP passive baseline
        run: |
          mkdir -p zap-results
          chmod 777 zap-results
          docker exec workplan-evidence curl --fail --silent --show-error --dump-header - \
            http://workplan-evidence:8080/ --output /dev/null | grep --ignore-case '^content-security-policy:'
          set +e
          docker run --rm --network workplan-evidence \
            --volume "$PWD/zap-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://workplan-evidence:8080 -I -J zap-report.json -r zap-report.html
          zap_status=$?
          set -e
          test "$zap_status" -le 2
          high_or_medium=$(jq '[.site[].alerts[]? | select((.riskcode | tonumber) >= 2)] | length' zap-results/zap-report.json)
          test "$high_or_medium" = 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-evidence-${{ github.run_id }}
          path: |
            soak-summary.txt
            zap-results/
      - name: Diagnostics
        if: failure()
        run: docker logs --tail 200 workplan-evidence || true
      - name: Stop containers
        if: always()
        run: |
          docker rm --force workplan-evidence || true
          docker network rm workplan-evidence || true
