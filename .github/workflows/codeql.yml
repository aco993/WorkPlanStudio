name: CodeQL

# Static analysis for the C# in this repo. Autobuild is not used: the app
# relinks native SQLite into WebAssembly, so the build needs the wasm-tools
# workload and would otherwise fail to produce an analysable trace.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Advisories land between pushes, so re-scan a quiet repo weekly.
    - cron: '32 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: CodeQL C# analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          # security-extended, not security-and-quality.
          #
          # The quality suite produced 48 alerts here and none was a defect:
          # 15 in generated obj/ output, the rest style preferences already
          # covered by .editorconfig, the Roslyn analyzers and
          # TreatWarningsAsErrors - plus 7 "generic catch clause" hits on the
          # deliberate boundary pattern where BrowserDatabase converts failures
          # into typed results and pages show a banner instead of blanking.
          #
          # A security tab full of "missed ternary operator" is how a team
          # learns to ignore the security tab, so this stays scoped to security
          # and the style gate stays in the Quality workflow where it belongs.
          queries: security-extended
          config: |
            paths-ignore:
              - '**/obj/**'
              - '**/bin/**'

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build WorkPlanStudio.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
