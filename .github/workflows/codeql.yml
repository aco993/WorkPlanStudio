name: CodeQL

# Static analysis for the C# in this repo. Autobuild is not used: the app
# relinks native SQLite into WebAssembly, so the build needs the wasm-tools
# workload and would otherwise fail to produce an analysable trace.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Advisories land between pushes, so re-scan a quiet repo weekly.
    - cron: '32 4 * * 1'
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight; only the
# latest state of a branch is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: CodeQL C# analysis
    # A pull request from a fork gets a read-only GITHUB_TOKEN, so
    # security-events: write cannot be granted and the SARIF upload fails —
    # which meant an outside contributor's first experience was a red check
    # they had no way to fix. Skipping is the honest option: pull_request_target
    # would run this workflow with the base repository's token against the
    # fork's code, which is the pattern that leaks write access. Fork changes
    # are scanned when they land on main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: csharp
          build-mode: manual
          # security-extended, not security-and-quality.
          #
          # The quality suite produced 48 alerts here and none was a defect:
          # 15 in generated obj/ output, the rest style preferences already
          # covered by .editorconfig, the Roslyn analyzers and
          # TreatWarningsAsErrors - plus 7 "generic catch clause" hits on the
          # deliberate boundary pattern where BrowserDatabase converts failures
          # into typed results and pages show a banner instead of blanking.
          #
          # A security tab full of "missed ternary operator" is how a team
          # learns to ignore the security tab, so this stays scoped to security
          # and the style gate stays in the Quality workflow where it belongs.
          queries: security-extended
          config: |
            paths-ignore:
              - '**/obj/**'
              - '**/bin/**'

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build WorkPlanStudio.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          category: /language:csharp
