name: CodeQL

# Static analysis for the C# in this repo. Autobuild is not used: the app
# relinks native SQLite into WebAssembly, so the build needs the wasm-tools
# workload and would otherwise fail to produce an analysable trace.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Advisories land between pushes, so re-scan a quiet repo weekly.
    - cron: '32 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: CodeQL C# analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build WorkPlanStudio.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
