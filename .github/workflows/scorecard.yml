name: Scorecard

# OpenSSF Scorecard: an outside opinion on this repository's supply-chain posture,
# scored against checks nobody here wrote.
#
# The point is the ones that disagree with us. Most of what Scorecard looks for is
# already true — actions pinned to a commit SHA, a branch ruleset, CodeQL, a
# SECURITY.md, least-privilege tokens — and a report that only confirms what the
# author already believes is worth nothing. What it is here for is the checks that
# come back low, so they are an argument rather than a blind spot.
#
# It writes SARIF into code scanning, so a finding lands in the same place CodeQL's
# do instead of in a log nobody opens.

on:
  branch_protection_rule:
  schedule:
    # Mondays, a few hours after the Performance run, so a slow week's worth of
    # runner time does not land all at once.
    - cron: '41 5 * * 1'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the result to code scanning.
      security-events: write
      # Needed by the action to read the branch ruleset, which is one of the
      # checks worth having an outside opinion on.
      contents: read
      actions: read
      # Publishing to the public dataset is what lets the README badge resolve.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The repository is public, so the result can be published. That is
          # what makes the badge a live number rather than a picture of one.
          publish_results: true

      - name: Upload the raw result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
