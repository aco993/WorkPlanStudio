version: 2
updates:
  # NuGet versions live in Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Listed before "microsoft" on purpose: a dependency joins the first group
      # whose patterns match it, and Microsoft.Playwright and the testing
      # extensions would otherwise be swept into the framework group. The test
      # stack moves together and is verified by the same run, so one pull
      # request per week for all of it beats seven.
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
          - "Microsoft.Playwright"
          - "Deque.AxeCore.*"
          - "bunit"
          - "CsCheck"
          - "BenchmarkDotNet"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
    # The packages that ship with the shared framework carry its major version:
    # Microsoft.AspNetCore.Authorization 11.0.0 is a .NET 11 package, and on the
    # .NET 10 runtime it fails at start-up - MissingMethodException for
    # IAuthorizationPolicyProvider.AllowsCachingPolicies, every API test red
    # (pull request #108). Their majors arrive with a TargetFramework change,
    # which is a decision with an ADR, not a weekly bump. Patches and minors on
    # the 10.x line still flow, and auto-merge them.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions in the workflows current. The workflows pin each
  # action to a commit SHA with the tag in a trailing comment; Dependabot
  # understands that form and bumps both together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
